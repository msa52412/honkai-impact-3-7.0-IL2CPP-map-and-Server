<!DOCTYPE html>
<!--
  这份是**源文件**。服务端 ServePage 读的是 run\webui\gm.html，
  改完必须同步过去，否则刷新页面看不到改动：

      copy app\server-v2\webui\gm.html app\server-v2\run\webui\gm.html

  （gm_hooks.json 则相反，只有 run\ 下那一份，按 mtime 热加载。）
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GM 控制台</title>
<style>
  :root{
    --bg:#12141a; --panel:#191c24; --panel2:#20242e; --line:#2b3140;
    --txt:#e6e9ef; --dim:#8b93a7; --accent:#4c9aff; --ok:#3ecf8e; --warn:#ffb020; --err:#ff5d5d;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  /* 整页锁死在视口内，不让日志把页面撑长；滚动只发生在 #out / aside 内部 */
  body{margin:0;background:var(--bg);color:var(--txt);overflow:hidden;
    font:13px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  /* 第三行用 minmax(0,1fr)：普通 1fr 的隐含最小值是内容高度，日志一长就把整页顶长 */
  .app{display:grid;grid-template-columns:280px 1fr;grid-template-rows:auto auto minmax(0,1fr);
    height:100vh;overflow:hidden}
  header{grid-column:1/3;display:flex;align-items:center;gap:14px;
    padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .endless{grid-column:1/3;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:8px 16px;background:#151922;border-bottom:1px solid var(--line);font-size:12px}
  .endless .grp{display:flex;align-items:center;gap:7px;padding:5px 10px;
    border:1px solid var(--line);border-radius:7px;background:#141821}
  .endless .grp.cur{border-color:var(--accent);background:#182234;box-shadow:0 0 0 1px #243b5e inset}
  .endless .grp.cur .lbl{color:#9fc3f5}
  .endless .lbl{color:var(--dim);letter-spacing:1px}
  .endless .sep{width:1px;height:18px;background:var(--line);margin:0 6px}
  .endless #endlessInfo{flex:1 1 100%;padding-left:2px}
  .endless label{display:flex;align-items:center;gap:5px;color:var(--dim)}
  .endless input{background:#0e1015;border:1px solid var(--line);color:var(--txt);
    padding:4px 6px;border-radius:5px;font:12px ui-monospace,Consolas,monospace;outline:none}
  .endless select{background:#0e1015;border:1px solid var(--line);color:var(--txt);
    padding:4px 6px;border-radius:5px;font:12px ui-monospace,Consolas,monospace;outline:none}
  .endless input[type=checkbox]{width:auto;padding:0}
  .endless button{padding:5px 11px;font-size:12px;border-radius:5px;background:var(--panel2);
    color:var(--txt);border:1px solid var(--line)}
  .endless button.on{background:#243b5e;border-color:var(--accent);color:#cfe3ff}
  .endless button.warn{color:var(--warn);border-color:#4a3a1a}
  .endless button.warn:hover{background:#2a2113}
  .endless button.cfg{color:#9fc3f5;border-color:#2a3a55}
  .endless button.cfg:hover{background:#1b2a42}
  header h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.5px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:6px}
  .dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .spacer{flex:1}
  .hint{color:var(--dim);font-size:12px}
  aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;
    padding:10px;min-height:0}
  /* 侧栏小标题：原来写成 section.title，但页面上是 div.title，选择器从来没匹配到 */
  aside .title{color:var(--dim);font-size:11px;text-transform:uppercase;
    letter-spacing:1px;margin:12px 4px 6px}
  .item{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
  .item:hover{background:var(--panel2)}
  .item.sel{background:#243b5e;outline:1px solid var(--accent)}
  .item .k{color:var(--dim);font-size:11px}
  .item .n{color:var(--txt);font-family:ui-monospace,Consolas,monospace}
  /* min-height:0 是关键：grid item 默认 min-height:auto，会被日志内容撑高 → 整页变长 */
  main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
  /* 日志框固定占满剩余高度，自己滚；不会随输出增长 */
  #out{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:auto;
    margin:0;padding:14px 16px;white-space:pre-wrap;word-break:break-word;
    font:12.5px/1.6 ui-monospace,Consolas,"Courier New",monospace;background:#0e1015}
  #out .cmd{color:var(--accent)}
  #out .err{color:var(--err)}
  #out .warn{color:var(--warn)}
  .bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
  .bar.off{display:none}
  /* 侧栏开关组（「刻晴 M43 剑气」等区块共用） */
  .patchbox{display:flex;flex-direction:column;gap:7px;margin:0 4px;padding:9px 10px;
    border:1px solid var(--line);border-radius:7px;background:#141821}
  .patchbox .row{display:flex;align-items:center;gap:6px}
  .patchbox button{padding:6px 10px;font-size:12px;border-radius:5px;background:var(--panel2);
    color:var(--txt);border:1px solid var(--line);cursor:pointer}
  .patchbox button:hover:not(:disabled){background:#26303f}
  .patchbox button:disabled{opacity:.45;cursor:default}
  .patchbox button.ghost{background:transparent}
  .patchbox button.cfg{color:#9fc3f5;border-color:#2a3a55}
  .patchbox button.cfg:hover:not(:disabled){background:#1b2a42}
  /* 常驻小字提示 + 补丁驻留警示条 */
  .patchbox .pnote{font-size:11px;line-height:1.5;color:var(--dim);
    border-top:1px dashed var(--line);padding-top:7px}
  .patchbox .pnote b{color:var(--warn);font-weight:600}
  .patchbox .pdirty{font-size:11.5px;line-height:1.5;padding:6px 8px;border-radius:5px;
    background:#2a1f0c;border:1px solid #5a4218;color:#ffcd7a}
  .patchbox .pdirty b{color:#ffb020}
  #line{flex:1;background:#0e1015;border:1px solid var(--line);color:var(--txt);
    padding:9px 11px;border-radius:6px;font:13px ui-monospace,Consolas,monospace;outline:none}
  #line:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:9px 18px;
    font-size:13px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px;color:var(--warn)}
  /* 刻晴 M43 区块：只有一个「开启剑气」，让它占满一整行；
     white-space:nowrap 防 flex 收缩把中文压成竖排。 */
  #kqGrp .row{flex-wrap:wrap}
  #kqGrp button{white-space:nowrap;flex:1 1 auto;padding:7px 9px}
  #kqGrp #kqState{font-size:12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>GM 控制台</h1>
    <span><span id="dot" class="dot"></span><span id="stat" class="hint">未连接</span></span>
    <span class="spacer"></span>
    <span class="hint">会话：<span id="curSession">未选择</span></span>
    <button class="ghost" id="refresh">刷新</button>
  </header>

  <div class="endless">
    <div class="grp">
      <span class="lbl">迪拉克之海</span>
      <label>配置ID <input id="diracId" type="text" placeholder="62136" style="width:82px"></label>
      <label>温度 <input id="diracTemp" type="number" min="0" style="width:68px"></label>
      <button id="diracApply">切换配置</button>
      <button id="diracReset" class="warn">清空记录</button>
      <button id="diracCfg" class="cfg">查看全部配置</button>
    </div>
    <div class="grp">
      <span class="lbl">量子奇点</span>
      <label>配置ID <input id="quantumId" type="text" placeholder="100033" style="width:82px"></label>
      <label>温度 <input id="quantumTemp" type="number" min="0" style="width:68px"></label>
      <button id="quantumApply">切换配置</button>
      <button id="quantumReset" class="warn">清空记录</button>
      <button id="quantumCfg" class="cfg">查看全部配置</button>
    </div>
    <div class="grp">
      <span class="lbl">超弦空间</span>
      <label>配置ID <input id="ultraId" type="text" placeholder="165" style="width:82px"></label>
      <label>温度 <input id="ultraTemp" type="number" min="0" style="width:68px"></label>
      <button id="ultraApply">切换配置</button>
      <button id="ultraReset" class="warn">清空记录</button>
      <button id="ultraCfg" class="cfg">查看全部配置</button>
    </div>
    <div class="grp">
      <span class="lbl">后崩坏书1 爬塔</span>
      <label>配置ID <input id="dlcWeather" type="number" min="0" style="width:72px" placeholder="1001"></label>
      <button id="dlcApply">切换配置</button>
      <button id="dlcReset" class="warn">清空记录</button>
      <button id="dlcCfg" class="cfg">查看全部配置</button>
    </div>
    <div class="grp">
      <span class="lbl">后崩坏书2 爬塔</span>
      <label>配置ID <input id="scdlcWeather" type="number" min="0" style="width:72px" placeholder="1002"></label>
      <button id="scdlcApply">切换配置</button>
      <button id="scdlcReset" class="warn">清空记录</button>
      <button id="scdlcCfg" class="cfg">查看全部配置</button>
    </div>
    <div class="grp">
      <span class="lbl">补给</span>
      <button id="gachaCfg" class="cfg">卡池设置</button>
    </div>
    <div class="grp">
      <span class="lbl">舰桥天气</span>
      <select id="wxMode">
        <option value="lock">锁定</option>
        <option value="auto">自动</option>
      </select>
      <span id="wxLockBox">
        <select id="wxCond">
          <option value="1">晴</option>
          <option value="2">多云</option>
          <option value="3">阴</option>
          <option value="4">雨</option>
          <option value="5">雪</option>
          <option value="6">风</option>
          <option value="7">雷</option>
          <option value="8">极端</option>
        </select>
      </span>
      <span id="wxAutoBox" style="display:none">
        <label>地区 <input id="wxRegion" type="text" placeholder="留空=按本机IP" style="width:116px"></label>
        <label><input id="wxAutoIp" type="checkbox" checked> 自动识别IP</label>
      </span>
      <button id="wxApply">应用</button>
      <span id="wxInfo" class="hint"></span>
    </div>
    <span id="endlessInfo" class="hint"></span>
  </div>

  <aside>
    <div class="title">在线会话</div>
    <div id="sessions"><div class="hint" style="padding:6px 8px">加载中…</div></div>
    <div class="title">命令</div>
    <div id="cmds"><div class="hint" style="padding:6px 8px">加载中…</div></div>
    <div class="title">外部命令（gm_hooks.json）</div>
    <div id="hooks"><div class="hint" style="padding:6px 8px">加载中…</div></div>

    <!-- 量子深渊修复区块已移除（2026-11-08）：五段 lua 补丁搬进 bh3bypass.dll
         的 [qtpatch] 模块，在游戏主线程的指令计数回调里执行，不再需要从外部
         拉 qt_watch.py 守护。后端 /gm/api/patch/* 接口还在，只是面板不再给按钮。 -->

    <!-- 刻晴 M43 武器槽：客户端 WeaponData 里 24244 这一行的三个 prop 槽
         写的是 1160 / 2211 / 2212，这三个技能在客户端烘焙技能表里根本不存在
         （表里只有 1159、2210、2135/2136 这些），所以永远没剑气、没被动。
         这个按钮在运行时把槽位改指向 1159（剑气），只动进程内存。
         表是常驻的，进主界面就能找到，不用先开武器面板。 -->
    <div class="title">刻晴 M43 剑气</div>
    <div class="patchbox" id="kqGrp" title="第一次点要扫 1.3 GB 内存，约 5 秒；之后记住地址，秒回。
换大关卡后若状态变成『未知』，说明表被重新加载了，再点一次即可。">
      <div class="row"><span id="kqState" class="hint">检测中…</span></div>
      <div class="row"><button id="kqWave">开启剑气</button></div>
      <div class="pnote">打开武器详情界面，只改内存，关游戏即还原。</div>
    </div>

    <!-- 舰桥主题：主界面加载哪个 3D 场景，看存档里的 User.WarshipId。
         EVA（400001）在客户端 SpaceShipConfig 里 Display=false，主题选择页里
         压根没这一项，玩家点不到 —— 只能从服务端改。 -->
    <div class="title">EVA 舰桥</div>
    <div class="patchbox" id="wsGrp">
      <div class="row"><button id="wsOpen">开启 EVA 舰桥</button></div>
      <div class="row"><span id="wsState" class="hint">读取中…</span></div>
      <div class="pnote">点一下就把<b>在线玩家</b>的 WarshipId 改成 400001 并推
        GetMainDataRsp —— 客户端当场切场景，不用重登。</div>
    </div>
  </aside>

  <main>
    <pre id="out"></pre>
    <div class="bar off">
      <!-- 命令行已隐藏（按需恢复：去掉 class="bar off" 里的 off 即可）。
           input/run 保留在 DOM 里，exec 相关逻辑照旧可用；
           左侧「命令」列表在命令行隐藏时改为弹窗补参数后直接执行。 -->
      <input id="line" placeholder="输入命令，例如 help / target / give gold 1000" autocomplete="off" spellcheck="false">
      <button id="run">执行</button>
    </div>
  </main>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const out = $('out'), lineEl = $('line'), runBtn = $('run');
  let session = null, sessionUid = 0, history = [], hpos = -1;

  // 滚到最新输出。#out 是固定高度的滚动容器（页面本身不滚），
  // 长文本换行会二次改变 scrollHeight，所以再补一帧确保真的贴底。
  function scrollEnd() {
    out.scrollTop = out.scrollHeight;
    requestAnimationFrame(() => { out.scrollTop = out.scrollHeight; });
  }

  function print(text, cls) {
    const span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = text.endsWith('\n') ? text : text + '\n';
    out.appendChild(span);
    scrollEnd();
  }

  async function api(path, opts) {
    const r = await fetch(path, opts);
    if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
    return r.json();
  }

  function setStatus(ok, text) {
    $('dot').className = 'dot' + (ok ? ' on' : '');
    $('stat').textContent = text;
  }

  async function loadSessions() {
    const box = $('sessions');
    try {
      const d = await api('/gm/api/sessions');
      setStatus(true, '已连接');
      if (!d.sessions.length) {
        box.innerHTML = '<div class="hint" style="padding:6px 8px">没有在线会话，先在客户端登录</div>';
        return;
      }
      box.innerHTML = '';
      d.sessions.forEach(s => {
        const el = document.createElement('div');
        el.className = 'item' + (session === s.id ? ' sel' : '');
        el.innerHTML = '<span class="n">' + (s.nick || '(无名)') + '</span>' +
                       '<span class="k">uid ' + s.uid + ' · Lv' + s.level + '</span>';
        el.title = s.id;
        el.onclick = () => {
          session = s.id; sessionUid = s.uid;
          $('curSession').textContent = s.nick + ' @ ' + s.id;
          loadSessions(); loadEndless(); loadTower();
        };
        box.appendChild(el);
      });
    } catch (e) {
      setStatus(false, '连接失败');
      box.innerHTML = '<div class="hint" style="padding:6px 8px">读取失败：' + e.message + '</div>';
    }
  }

  async function loadCommands() {
    const box = $('cmds');
    try {
      const d = await api('/gm/api/commands');
      box.innerHTML = '';
      d.commands.forEach(c => {
        const el = document.createElement('div');
        el.className = 'item';
        el.innerHTML = '<span class="n">' + c.name + '</span><span class="k">' + c.type + '</span>';
        el.title = (c.desc || '') + (c.examples && c.examples.length ? '\n例：' + c.examples.join('\n例：') : '');
        el.onclick = () => {
          const base = c.name + ' ';
          // 底部命令行被隐藏时输入框不可见，点击命令改成「弹窗补参数 → 直接执行」，
          // 否则会把命令写进一个看不见的输入框里，看起来像点了没反应。
          if (lineEl.offsetParent === null) {
            const v = prompt('执行命令（可补参数）', base.trim());
            if (v === null) return;
            const s = v.trim();
            if (s) execLine(s);
            return;
          }
          lineEl.value = base;
          lineEl.focus();
        };
        box.appendChild(el);
      });
    } catch (e) {
      box.innerHTML = '<div class="hint" style="padding:6px 8px">读取失败：' + e.message + '</div>';
    }
  }

  async function exec() {
    const line = lineEl.value.trim();
    if (!line) return;
    lineEl.value = '';
    await execLine(line);
  }

  // 真正的执行入口：底部命令行隐藏后，命令列表点击也走这里
  async function execLine(line) {
    history.push(line); hpos = history.length;
    print('> ' + line, 'cmd');
    runBtn.disabled = true;
    try {
      const d = await api('/gm/api/exec', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: session, line: line })
      });
      const text = (d.output || '').replace(/^> .*\n/, '');
      print(text || '(无输出)', d.ok ? null : 'err');
    } catch (e) {
      print('请求失败：' + e.message, 'err');
    } finally {
      runBtn.disabled = false;
      lineEl.focus();
      scrollEnd();
    }
  }

  async function loadHooks() {
    const box = $('hooks');
    try {
      const d = await api('/gm/api/hooks');
      // 下划线开头的是页面内专用区块的私有 hook（「刻晴 M43 武器槽」用
      // _keqing-m43-*），不在这个通用列表里重复出现。
      const list = d.hooks.filter(h => h.name.charAt(0) !== '_');
      if (!list.length) {
        box.innerHTML = '<div class="hint" style="padding:6px 8px">没有配置（run\\gm_hooks.json）</div>';
        return;
      }
      box.innerHTML = '';
      list.forEach(h => {
        const el = document.createElement('div');
        el.className = 'item';
        el.innerHTML = '<span class="n">▶ ' + h.name + '</span>';
        el.title = (h.desc || '') + '\n' + (h.cmd || '');
        el.onclick = () => runHook(h.name);
        box.appendChild(el);
      });
    } catch (e) {
      box.innerHTML = '<div class="hint" style="padding:6px 8px">读取失败：' + e.message + '</div>';
    }
  }

  async function runHook(name) {
    print('▶ ' + name, 'cmd');
    try {
      const d = await api('/gm/api/hook', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      });
      print(d.output || '(无输出)', d.ok ? null : 'err');
    } catch (e) {
      print('请求失败：' + e.message, 'err');
    }
  }

  // ---------------- 三套深渊 + 两座爬塔，各自独立 ----------------
  // 深渊：POST /gm/api/endless/{dirac|quantum|ultra}  {id, temp}
  // 爬塔：POST /gm/api/tower/{dlc|scdlc}            {weather}
  // 清空：POST /gm/api/endless/reset {mode, uid} / POST /gm/api/tower/reset {mode, uid}
  const MODES = [
    { key: 'dirac',   type: 2, name: '迪拉克之海' },
    { key: 'quantum', type: 3, name: '量子奇点' },
    { key: 'ultra',   type: 4, name: '超弦空间' }
  ];

  const TOWERS = [
    { key: 'dlc',   name: '后崩坏书1 爬塔' },
    { key: 'scdlc', name: '后崩坏书2 爬塔' }
  ];

  let abyssState = null, towerState = null;

  function grpOf(key, suffix) {
    const el = $(key + (suffix || 'Id'));
    return el ? el.closest('.grp') : null;
  }

  // 两套状态合并成一行提示，谁先加载完都行
  function renderInfo() {
    const parts = [];

    if (abyssState) {
      const d = abyssState;
      let s = '当前深渊: ' + ((MODES.find(m => m.type === d.selected) || {}).name || d.selected);
      const p = sessionUid && d.progress ? d.progress[sessionUid] : null;
      if (p) {
        const dirac = p.abyss2 ? ('迪 ' + p.abyss2.score + '分/' + p.abyss2.finished + '组') : '迪 无';
        const qt = p.abyss3 ? ('量 ' + p.abyss3.score + '分/' + p.abyss3.finished + '组') : '量 无';
        const ul = (p.ultra && p.ultra.totalScore) ? ('超弦 ' + p.ultra.totalScore + '分') : '超弦 无';
        s += ' || uid ' + sessionUid + ': ' + dirac + ' · ' + qt + ' · ' + ul;
      } else if (!sessionUid) {
        s += ' || 未选会话（清空记录需要先选）';
      }
      parts.push(s);
    }

    if (towerState) {
      const d = towerState.dlc || {}, q = towerState.scdlc || {};
      let s = '爬塔: 后1 天气' + (d.effWeather || '?') + '(赛季' + (d.effScheduleId || '?') + ')'
            + ' · 后2 天气' + (q.effWeather || '?') + '(赛季' + (q.effScheduleId || '?') + ')';
      const p = sessionUid ? towerState.progress : null;
      if (p) {
        s += ' || 后1 ' + (p.dlc ? (p.dlc.progress + '/' + p.dlc.maxProgress + ' 层') : '无记录')
           + ' · 后2 ' + (p.scdlc ? (p.scdlc.curFloor + '/' + p.scdlc.maxFloorReached + ' 层') : '无记录');
      }
      parts.push(s);
    }

    $('endlessInfo').textContent = parts.join('   ‖   ') || '读取中…';
  }

  async function loadEndless() {
    try {
      const d = await api('/gm/api/endless');
      abyssState = d;

      MODES.forEach(m => {
        const st = d[m.key] || {};
        const idEl = $(m.key + 'Id');
        idEl.value = (st.id === undefined || st.id === null) ? '' : st.id;
        idEl.title = '留空再点「切换配置」= 只把面板切到' + m.name + '，不改配置号';
        $(m.key + 'Temp').value = st.temp || '';
        const g = grpOf(m.key);
        if (g) g.classList.toggle('cur', d.selected === m.type);
      });

      // 量子温度没单独配过时，实际生效的是迪拉克那档 —— 提示出来，免得以为没生效
      const q = d.quantum || {};
      const qtTemp = $('quantumTemp');
      qtTemp.placeholder = q.temp ? '' : ('继承' + (q.fallbackTemp || 0));
      qtTemp.title = q.temp
        ? '量子奇点独立温度'
        : ('未单独配置，实际继承迪拉克之海的温度 ' + (q.fallbackTemp || 0) + '；填一个数再点「切换配置」即可独立');

      renderInfo();
    } catch (e) {
      $('endlessInfo').textContent = '读取深渊状态失败: ' + e.message;
    }
  }

  async function loadTower() {
    try {
      const d = await api('/gm/api/tower' + (sessionUid ? ('?uid=' + sessionUid) : ''));
      towerState = d;

      TOWERS.forEach(t => {
        const st = d[t.key] || {};
        const el = $(t.key + 'Weather');
        el.value = st.weather || '';
        // 没指定天气时，把实际生效的那个天气当占位符显示
        el.placeholder = st.effWeather || '';
        el.title = '当前生效：天气 ' + st.effWeather + ' / 赛季 ' + st.effScheduleId
                 + ' / ConfigType ' + st.configType + ' / ' + st.maxFloor + ' 层\n'
                 + st.start + ' ~ ' + st.end
                 + '\n（填 0 可取消指定，回到按时间自动选赛季）';
      });

      renderInfo();
    } catch (e) {
      print('读取爬塔状态失败：' + e.message, 'err');
    }
  }

  async function postEndless(path, body, label) {
    print('» ' + label, 'cmd');
    try {
      const d = await api(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      print(d.output || '(无输出)', d.ok ? null : 'err');
      loadEndless();
      loadTower();
    } catch (e) {
      print('请求失败：' + e.message, 'err');
    }
  }

  function applyMode(m) {
    const id = ($(m.key + 'Id').value || '').trim();
    const temp = parseInt($(m.key + 'Temp').value || '0', 10) || 0;

    // ID 留空 = 只切面板指向，不动配置号。
    // 以前这里是打印一句提示就 return，不发请求，看起来就像按钮点了没反应
    // （而且现在配置号已经由 loadEndless 回填，留空通常意味着「只想换一套深渊」）。
    if (!id) {
      postEndless('/gm/api/endless/select', { mode: m.key },
        '切到 ' + m.name + '（配置号保持不变）');
      return;
    }

    postEndless('/gm/api/endless/' + m.key, { id: id, temp: temp },
      '切换 ' + m.name + ' -> ID ' + id + '，温度 ' + (temp || '(未改)'));
  }

  function resetMode(m) {
    if (!sessionUid) { print('先在左边选一个会话（清空记录按 uid）', 'err'); return; }
    postEndless('/gm/api/endless/reset', { mode: m.key, uid: sessionUid },
      '清空 ' + m.name + ' 记录 uid=' + sessionUid);
  }

  // ---------------- 爬塔 ----------------

  function applyTower(t) {
    const el = $(t.key + 'Weather');
    const raw = (el.value || '').trim();
    // 空 = 取消指定（回到按时间选赛季），所以空不拦，按 0 处理
    const id = raw === '' ? 0 : (parseInt(raw, 10) || 0);
    postEndless('/gm/api/tower/' + t.key, { weather: id },
      '切换 ' + t.name + ' -> ID ' + (id || '(取消指定)'));
  }

  function resetTower(t) {
    if (!sessionUid) { print('先在左边选一个会话（清空记录按 uid）', 'err'); return; }
    postEndless('/gm/api/tower/reset', { mode: t.key, uid: sessionUid },
      '清空 ' + t.name + ' 记录 uid=' + sessionUid);
  }

  MODES.forEach(m => {
    $(m.key + 'Apply').onclick = () => applyMode(m);
    $(m.key + 'Reset').onclick = () => resetMode(m);
    // 查看全部配置：新标签打开该深渊的天气/BOSS 配置表（服务端从 docs\*.xlsx 渲染）
    $(m.key + 'Cfg').onclick = () => window.open('/gm/config/' + m.key, '_blank');
    [m.key + 'Id', m.key + 'Temp'].forEach(k => {
      $(k).addEventListener('keydown', e => { if (e.key === 'Enter') applyMode(m); });
    });
  });

  TOWERS.forEach(t => {
    $(t.key + 'Apply').onclick = () => applyTower(t);
    $(t.key + 'Reset').onclick = () => resetTower(t);
    // 爬塔表来自游戏配置 json（DLCTower* / ScDLCTower*），不是 xlsx
    $(t.key + 'Cfg').onclick = () => window.open('/gm/config/' + t.key, '_blank');
    $(t.key + 'Weather').addEventListener('keydown', e => { if (e.key === 'Enter') applyTower(t); });
  });

  // 卡池设置：独立页面（改 gacha_pool_*.json，服务端按 mtime 热加载）
  $('gachaCfg').onclick = () => window.open('/gm/gacha', '_blank');

  // ---------------- 天气（主界面）----------------
  // 锁定 = 固定一个 WeatherType，24 小时都一样
  // 自动 = 填地区（留空则按本机 IP），服务端查真实天气后映射给客户端
  let wxTemp = 25;

  function wxModeUI() {
    const auto = $('wxMode').value === 'auto';
    $('wxLockBox').style.display = auto ? 'none' : '';
    $('wxAutoBox').style.display = auto ? '' : 'none';
    // 勾了「自动识别IP」就不用填地区了
    const byIp = $('wxAutoIp').checked;
    $('wxRegion').disabled = byIp;
    $('wxRegion').placeholder = byIp ? '按本机IP' : '留空=按本机IP';
  }

  async function loadWeather() {
    try {
      const d = await api('/gm/api/weather');
      $('wxMode').value = d.mode === 'auto' ? 'auto' : 'lock';
      $('wxCond').value = String(d.condition);
      $('wxRegion').value = d.region || '';
      $('wxAutoIp').checked = !!d.autoIp;
      wxTemp = d.temp || 25;
      wxModeUI();
      const l = d.last || {};
      if (!l.at) {
        $('wxInfo').textContent = '';
      } else if (l.ok) {
        $('wxInfo').textContent = '上次 ' + l.at + '：' + (l.place || '?') + ' · '
          + l.conditionName + ' · ' + l.temp + '°C';
      } else {
        $('wxInfo').textContent = '上次 ' + l.at + ' 失败：' + (l.error || '?');
      }
      $('wxInfo').title = l.source || '';
    } catch (e) {
      $('wxInfo').textContent = '读取失败：' + e.message;
    }
  }

  async function applyWeather() {
    const mode = $('wxMode').value;
    $('wxInfo').textContent = mode === 'auto' ? '查询天气中…' : '保存中…';
    try {
      const d = await api('/gm/api/weather', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: mode,
          condition: Number($('wxCond').value || 1),
          region: $('wxRegion').value.trim(),
          auto_ip: $('wxAutoIp').checked,
          temp: wxTemp
        })
      });
      print((d.output || '').trim(), d.ok ? null : 'err');
      await loadWeather();
    } catch (e) {
      $('wxInfo').textContent = '请求失败：' + e.message;
    }
  }

  $('wxMode').onchange = wxModeUI;
  $('wxAutoIp').onchange = wxModeUI;
  $('wxApply').onclick = applyWeather;

  // （量子深渊修复的前端已经移除：补丁搬进 bh3bypass.dll 的 [qtpatch]，在游戏
  //   主线程执行，不需要外部守护进程了。后端 /gm/api/patch/* 接口保留未动。）

  // ---------------- 刻晴 M43 剑气 ----------------
  // 走 gm_hooks.json 的 _keqing-m43-wave，前端只管调用和上色。
  // hook 是同步 HTTP：点下去之后浏览器会一直等 python 退出（正常 1~5 秒，
  // 极端情况下扫完整个 Unity 堆要十几秒），期间必须把按钮禁掉，否则连点
  // 会起来好几个进程同时往同一个地址写内存。
  const KQ_COLOR = { ok: 'var(--ok)', err: 'var(--err)', dim: 'var(--dim)' };

  function kqSet(text, kind) {
    const el = $('kqState');
    el.textContent = text;
    el.style.color = KQ_COLOR[kind] || KQ_COLOR.dim;
  }

  async function kqRun(name, label) {
    print('» ' + label, 'cmd');
    const btn = $('kqWave');
    btn.disabled = true;
    kqSet('执行中…（别关面板）', 'dim');
    try {
      const d = await api('/gm/api/hook', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      });
      const text = (d.output || '').trim();
      print(text || '(无输出)', d.ok ? null : 'err');
      // python 那边只在结论行加 [ OK ] / [FAIL]，拿来当状态条
      const lines = text.split('\n');
      const bad = lines.find(l => l.indexOf('[FAIL]') >= 0);
      const good = lines.find(l => l.indexOf('[ OK ]') >= 0);
      if (bad) kqSet(bad.replace('[FAIL]', '✗').trim(), 'err');
      else if (good) kqSet(good.replace('[ OK ]', '✓').trim(), 'ok');
      else kqSet(d.ok ? '完成（看日志）' : '执行失败（看日志）', d.ok ? 'dim' : 'err');
    } catch (e) {
      print('请求失败：' + e.message, 'err');
      kqSet('请求失败：' + e.message, 'err');
    } finally {
      btn.disabled = false;
    }
  }

  $('kqWave').onclick = () => kqRun('_keqing-m43-wave', '刻晴 M43 → 开启剑气（槽位指向 1159）');

  // 打开面板时问一句「现在开着吗」。走 _keqing-m43-status：只读上次记的地址、
  // 不扫内存，所以是毫秒级，可以放心在页面加载时调。
  async function kqStatus() {
    if ($('kqWave').disabled) return;          // 正在执行，别插队
    try {
      const d = await api('/gm/api/hook', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: '_keqing-m43-status' })
      });
      const t = ((d.output || '').trim().split('\n')[0] || '未知').trim();
      if (t.indexOf('已开启') === 0) kqSet('✓ ' + t, 'ok');
      else if (t.indexOf('未开启') === 0) kqSet(t, 'dim');
      else kqSet(t, 'dim');
    } catch (e) {
      kqSet('读取状态失败：' + e.message, 'err');
    }
  }

  // ---------------- EVA 舰桥强开 ----------------
  // 照 docs\舰桥隐藏主题-EVA联动排查.md：
  //   SetWarshipReqHandler 不校验 id，直接 User.WarshipId = req.WarshipId，
  //   然后回一个带 WarshipTheme 的 GetMainDataRsp，客户端当场换场景。
  // 所以这里只做一个按钮：把在线玩家的 WarshipId 改成 400001 并让他推包。
  const EVA_ID = 400001;
  let wsOnline = null;

  async function loadWarship() {
    try {
      const d = await api('/gm/api/warship');
      wsOnline = (d.players || []).find(x => x.online) || null;
      const btn = $('wsOpen');
      if (wsOnline) {
        const on = wsOnline.warship_id === EVA_ID;
        $('wsState').textContent = '在线：' + (wsOnline.nick || ('uid ' + wsOnline.uid))
          + '（' + wsOnline.uid + '）· 当前 ' + (on ? '已是 EVA' : ('WarshipId=' + wsOnline.warship_id));
        btn.disabled = false;
      } else {
        $('wsState').textContent = '没有在线玩家 —— 先登录游戏';
        btn.disabled = true;
      }
    } catch (e) {
      $('wsState').textContent = '✗ 读取失败：' + e.message;
      $('wsOpen').disabled = true;
    }
  }

  $('wsOpen').onclick = async () => {
    if (!wsOnline) return;
    print('» 开启 EVA 舰桥（uid=' + wsOnline.uid + '）', 'cmd');
    try {
      const d = await api('/gm/api/warship', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid: wsOnline.uid, warship_id: EVA_ID })
      });
      print((d.output || '(无输出)').trim(), d.ok ? null : 'err');
    } catch (e) {
      print('请求失败：' + e.message, 'err');
    }
    loadWarship();
  };

  runBtn.onclick = exec;
  $('refresh').onclick = () => { loadSessions(); loadCommands(); loadHooks(); loadEndless(); loadTower(); loadWeather(); kqStatus(); loadWarship(); };
  lineEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { exec(); return; }
    if (e.key === 'ArrowUp') { if (hpos > 0) { hpos--; lineEl.value = history[hpos]; } e.preventDefault(); }
    if (e.key === 'ArrowDown') { if (hpos < history.length - 1) { hpos++; lineEl.value = history[hpos]; } else { hpos = history.length; lineEl.value = ''; } e.preventDefault(); }
  });

  print('GM 控制台就绪。命令来自服务端 CommandFactory，和命令行 help 同一份。');
  loadSessions();
  loadCommands();
  loadHooks();
  loadEndless();
  loadTower();
  loadWeather();
  kqStatus();
  loadWarship();
  setInterval(loadSessions, 5000);
})();
</script>
</body>
</html>
